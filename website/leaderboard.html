<!DOCTYPE html>
<html>

<head>
    <title>Battle Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="github-markdown-light.css">
    <link rel="stylesheet" href="pokesprite-docs.css">
    <script type="module" src="utility.js"></script>
    <style>
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 0px;
        }

        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
    </style>
</head>

<body style="margin: 0px; padding: 0px; overflow: hidden">
    <div class="markdown-body" style="max-width: 100%;">
        <table style="width: 100%; border: 0; border-collapse: collapse; table-layout: fixed;">
            <tr>
                <td style="width: 35%;">
                    <table class="pokesprite" id="battle-log" style="max-height: 100vh; overflow-y: scroll; ">
                        <caption>Battle History</caption>
                        <thead>
                            <tr>
                                <td>Date</td>
                                <td>Left Side</td>
                                <td></td>
                                <td>Elo</td>
                                <td>Rank</td>
                                <td>Right Side</td>
                                <td></td>
                                <td>Elo</td>
                                <td>Rank</td>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table><button type="button">Button</button>
                </td>
                <td style="width: 65%">
                        <table class="pokesprite" id="leaderboard" style="table-layout: fixed; max-height: 100vh; overflow-y: scroll;">
                            <caption>
                                <header>Emerald Battle Simulator Leaderboard</header><i>as of </i>
                            </caption>
                            <thead>
                                <tr>
                                    <th class="order">Last Match</th>
                                    <th class="order">Rank</th>
                                    <th>Class</th>
                                    <th class="order">Name</th>
                                    <th>League</th>
                                    <th class="order">UUID</th>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                    <th class="order">Points</th>
                                    <th class="order">Wins</th>
                                    <th class="order">Losses</th>
                                    <th class="order">Win %</th>
                                    <th class="order">Battles</th>
                                    <th class="order">Win Streak</th>
                                </tr>
                            </thead>
                            <tbody id="player-list">
                            </tbody>
                        </table>
                        <script type="module" src="leaderboard.js"></script>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
