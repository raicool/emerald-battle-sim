<!DOCTYPE html>
<html><head>
<meta http-equiv="content-type" content="text/html; charset=windows-1252">
    <title>Battle Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" id="page-theme" href="github-markdown-light.css">
    <link rel="stylesheet" href="pokesprite-docs.css">
	<link rel="stylesheet" href="player.css">
    <script type="module" src="theme.js"></script>
    <script type="module" src="utility.js"></script>
    <script type="module" src="constants.js"></script>
    <style>
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 0px;
        }

        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
    </style>
</head>

<body style="margin: 0px; padding: 0px; overflow: hidden">
    <div class="markdown-body" style="max-width: none; max-height: none;">
        <table style="width: 100vw; height: 100vh; border: 0; display: table;">
			<thead style="min-height: 15%;">
				<td colspan="100%" style="text-align: center; font-size:32px;">
					Emerald Battle Simulator Leaderboard
				</td>
			</thead>
            <tbody>
				<tr>
					<td style="width: 35%; padding: 0px; vertical-align: top; overflow: hidden;">
						<table class="pokesprite" id="battle-log">
							<caption>Battle History</caption>
							<thead>
								<tr>
									<td>Date</td>
									<td>Left Side</td>
									<td></td>
									<td>Elo</td>
									<td>Rank</td>
									<td>Right Side</td>
									<td></td>
									<td>Elo</td>
									<td>Rank</td>
								</tr>
							</thead>
							<tbody>
								<!-- battle history rows go here -->
							</tbody>
						</table><button type="button">Button</button>
					</td>
					<td style="width: 65%; padding: 0px; vertical-align: top;">
						<table class="pokesprite" id="leaderboard">
							<caption>
								updated as as of <i id="refresh-timestamp"></i>
							</caption>
							<thead>
								<tr>
									<th class="order">Last Match</th>
									<th class="order">Rank</th>
									<th>Class</th>
									<th class="order">Name</th>
									<th>League</th>
									<th class="order">UUID</th>
									<th></th>
									<th></th>
									<th></th>
									<th></th>
									<th></th>
									<th></th>
									<th class="order">Points</th>
									<th class="order">Wins</th>
									<th class="order">Losses</th>
									<th class="order">Win %</th>
									<th class="order">Battles</th>
									<th class="order">Win Streak</th>
								</tr>
							</thead>
							<tbody>
								<!-- leaderboard player rows go here -->
							</tbody>
						</table>
						<script type="module" src="leaderboard.js"></script>
					</td>
				</tr>
			</tbody>
		</table>
    </div>
	<div id="pkmn-inspect"></div>
</body>
</html>
